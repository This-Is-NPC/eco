# Graders never answer, and never see which model wrote an answer.
# The decider gives typed answers with probabilities: whether each point of the
# answer key is there, a 1-5 rubric score, and which of two answers is better.
[decider]
name = "gpt-6-luna-decisions"
base_url = "https://openrouter.ai/api/alpha"
model = "openai/gpt-6-luna-decisions"
api_key_env = "OPENROUTER_API_KEY"

# What has no probability is judged adversarially: the examiner decides the
# points the decider is unsure of, quoting the answer, and lists the answer's
# claims, quoting the sources; the adversary tries to prove each verdict wrong,
# quoting too. A verdict it disproves is marked disputed and earns nothing.
[[judges]]
name = "gpt-6-luna"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-6-luna"
api_key_env = "OPENROUTER_API_KEY"

