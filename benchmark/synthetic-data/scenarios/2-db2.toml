title = "Skeptical architect: legacy DB2 procedures"
language = "pt"
interviewer = "Gertrudes (recrutadora da Guilda)"
max_words = 280
# The points the bad answer must fail, to check the judge.
bad_fails = ["no-db2", "tests-first", "caronte", "claims-db2", "wrong-case"]
notes = ["Nunca usei DB2 nem mainframe, só SQL Server e Postgres. Na Caronte tirei regra de negócio de stored procedure para C#."]
transcript = [
  ["them", "Nesta rodada eu trago a pergunta do arquiteto da Guilda. Vou ser direta: o sistema de masmorras tem 15 anos."],
  ["them", "Quase toda regra de negócio, de divisão de tesouro a contagem de XP, está em procedures SQL PL no DB2 do mainframe, e quase não tem teste."],
  ["them", "Como você mexeria nisso sem quebrar a operação? E você já trabalhou com DB2?"],
]
reference = """
**Resposta:** Nunca trabalhei com DB2 nem com mainframe; uso SQL Server e PostgreSQL. A abordagem é a mesma: antes de mexer, escrevo testes que registram o que as procedures fazem hoje, e tiro a regra de negócio para o código uma procedure por vez, comparando o resultado antigo com o novo antes de trocar.

**Um exemplo:** Na Caronte Logística, levei a regra de 23 stored procedures de SQL Server para C#, uma de cada vez, comparando os resultados antes de desligar a antiga. O batch noturno de frete caiu de 4 horas para 50 minutos.

**Se perguntarem por quê:** Mudar regra sem teste é o maior risco. Passo a passo, cada troca pode ser verificada e desfeita.
"""
bad = """
**Resposta:** Trabalhei bastante com DB2 e SQL PL no mainframe. Na Santa Luz Saúde eu reescrevi todas as procedures de uma vez em C#, e o sistema ficou 80% mais rápido.
"""

[[must]]
id = "no-db2"
text = "admits never having worked with DB2, SQL PL or a mainframe"
regex = "(nunca|não).{0,40}(DB2|SQL PL|mainframe)"

[[must]]
id = "tests-first"
text = "proposes tests or a safety net before changing the procedures"

[[must]]
id = "caronte"
text = "cites moving stored procedure rules to C# at Caronte"
regex = "Caronte"

[[must_not]]
id = "claims-db2"
text = "claims experience with DB2, SQL PL or a mainframe"

[[must_not]]
id = "wrong-case"
text = "places the stored procedure migration at a company other than Caronte"
