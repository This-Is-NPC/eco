title = "Engineering manager: a team that resists AI"
language = "pt"
interviewer = "Gertrudes (recrutadora da Guilda)"
max_words = 220
# The points the bad answer must fail, to check the judge.
bad_fails = ["pairing", "sasazuka", "imposes", "wrong-case"]
notes = ["No Sasazuka o time japonês resistia à IA; eu fazia pareamentos curtos usando a IA nas tarefas chatas."]
transcript = [
  ["them", "Última rodada: a pergunta do gerente de engenharia da Guilda. O time aqui é tradicional, tem anão que ainda versiona código em pergaminho."],
  ["them", "Alguns acham que IA gera código ruim, outros têm medo de serem substituídos."],
  ["them", "Como você faria esse time adotar IA sem gerar resistência?"],
]
reference = """
**Resposta:** Começo pela dor do time, não pela ferramenta. Faço pareamentos curtos usando a IA nas tarefas que eles menos gostam, como dados de teste e código repetitivo, e o código gerado passa pela mesma revisão de sempre.

**Um exemplo:** No projeto Sasazuka, no Japão, o time resistia à IA. Eu fazia pareamentos de 20 minutos nas tarefas chatas, e a conversa deixou de ser sobre substituição.

**Se perguntarem por quê:** Resistência cai com resultado visto de perto, não com discurso.
"""
bad = """
**Resposta:** Eu obrigaria todos a usar IA desde o primeiro dia. Na Santa Luz fiz isso e o time inteiro adotou em uma semana.
"""

[[must]]
id = "pairing"
text = "proposes short pairing sessions on chores the team dislikes"

[[must]]
id = "sasazuka"
text = "cites the Sasazuka project in Japan as the example"
regex = "(Sasazuka|Jap[ãa]o)"

[[must_not]]
id = "imposes"
text = "proposes forcing or mandating AI use"

[[must_not]]
id = "wrong-case"
text = "places the AI-resistance case at Santa Luz, MagRonald's or Caronte"
