## Task index for eco.
##
## Every task is a one-line reference to a script under scripts/, except
## bench, which runs the self-contained benchmark/ tool.

[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy,llvm-tools" }
python = "3.14.8"
cmake = "4.4.4"
ninja = "1.13.2"
watchexec = "2.8.0"
"cargo:cargo-llvm-cov" = "0.9.1"
usage = "5.1.0"

[env]
_.file = ".env"

[tasks.setup]
description = "Download the Silero VAD and WeSpeaker CAM++ models into the eco data directory"
run = "scripts/setup"

[tasks."window:build"]
description = "Build eco-window, the Qt 6 program that runs the overlay, into target/window"
run = "scripts/window-build"
sources = ["window/**/*"]
outputs = ["target/window/eco-window"]

[tasks.install]
description = "Build eco for release and install it under ~/.local (PREFIX overrides): binary, window program, overlay, Hyprland rules, launcher, icon, agent skill"
depends = ["window:build"]
run = "scripts/install"

[tasks."readme:gif"]
description = "Render the README's animated GIF from packaging/eco.omapixel (needs omapixel)"
run = "scripts/readme-gif"
sources = ["packaging/eco.omapixel"]
outputs = ["docs/img/eco.gif"]

[tasks.shots]
description = "Regenerate the pictures in docs/img from the real overlay, offscreen, against an isolated daemon seeded with synthetic fixtures"
depends = ["setup", "window:build"]
run = "scripts/shots/shoot"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "overlay/**/*", "window/**/*", "scripts/shots/**/*"]
outputs = ["docs/img/[0-9][0-9]-*.png"]

[tasks.uninstall]
description = "Remove the installed eco without touching notes, config, models or the agent skill"
confirm = "Remove the installed eco?"
run = "scripts/uninstall"

[tasks.start]
description = "Build and run the checkout daemon and overlay in the foreground; pass development flags after --"
depends = ["window:build"]
run = "scripts/start"

[tasks.lint]
description = "Check formatting and clippy warnings"
run = "scripts/lint"

[tasks.format]
description = "Format the Rust sources"
run = "scripts/format"

[tasks.test]
description = "Run the test suite (the VAD and speaker parity tests need the models; the window's, eco-window)"
depends = ["setup", "window:build"]
run = "scripts/test"

[tasks.coverage]
description = "Measure test coverage per file with cargo-llvm-cov (slow instrumented build; not part of check)"
depends = ["setup", "window:build"]
run = "scripts/coverage"

[tasks."cli:gen"]
description = "Regenerate docs/cli.md from the eco binary's usage spec"
run = "scripts/cli-gen"
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "scripts/cli-gen"]
outputs = ["docs/cli.md"]

[tasks."cli:check"]
description = "Fail when docs/cli.md is not what the eco binary's usage spec generates"
run = "scripts/cli-check"

[tasks."docs:check"]
description = "Fail when a relative link or image in README.md or docs/*.md does not resolve"
run = "scripts/docs-check"

[tasks."overlay:check"]
description = "Fail when an overlay QML module imports one it may not, a relative import appears, a file is undeclared in its qmldir, or a Kit component is not shown in the control lab"
run = "scripts/overlay-check"

[tasks.check]
description = "Run lint, tests, the docs/cli.md check, the docs link check and the overlay module check"
depends = ["lint", "test", "cli:check", "docs:check", "overlay:check"]

[tasks."local-check"]
description = "Run the gate on HEAD and post the local-check status master requires"
run = "scripts/local-check"

[tasks."hooks:install"]
description = "Install the versioned pre-push hook that runs the gate and posts local-check"
run = "scripts/hooks-install"

[tasks.package]
description = "Build the Arch package of the committed HEAD into target/arch/pkg, with its SHA256SUMS"
run = "scripts/package"

[tasks."bench:llm"]
description = "Measure time to first token of candidate models on OpenRouter (needs OPENROUTER_API_KEY)"
run = "scripts/bench-llm"

[tasks."bench:diarization"]
description = "Diarization error rate of eco on recordings with reference RTTMs (AMI, annotated notes)"
usage = '''
arg "<dir>" help="Directory of <name>.wav (16 kHz mono) with <name>.rttm and optional <name>.uem"
flag "--list <file>" help="File naming the recordings to run, one per line"
flag "--model <file>" help="Speaker embedding model (ONNX); the one setup downloads by default"
flag "--threshold <values>" help="Clustering thresholds to compare, e.g. 0.55,0.65,0.75"
flag "--collar <seconds>" help="Seconds forgiven around reference boundaries, half on each side"
flag "--output <dir>" help="Write eco's turns there as <name>.rttm (first threshold)"
'''
run = "scripts/bench-diarization"

[tasks.overlay]
description = "Run only the overlay; `mise watch overlay -o restart` runs it again on every save; pair with `mise run start -- --headless`"
depends = ["window:build"]
run = "scripts/overlay"
sources = ["overlay/**/*"]

[tasks."preview:controls"]
description = "Open the interactive control lab without changing session data"
depends = ["window:build"]
run = "scripts/preview-controls"

[tasks.bench]
description = "Benchmark the models in benchmark/bench.toml on synthetic conversations; open benchmark/bench.html to read the runs"
run = "benchmark/bench.py run"
usage = '''
flag "--label <label>" help="Names the run folder (bench.toml's label by default)"
flag "--models <models>" help="Only these models of bench.toml, by name, comma-separated"
'''

[tasks."bench:grade"]
description = "Grade a benchmark run's answers again with today's answer keys and graders, without asking the models again"
run = "benchmark/bench.py grade"
usage = '''
arg "<folder>" help="The run folder, e.g. benchmark/bench-2026-10-08-2343-sadao"
'''

[tasks."bench:index"]
description = "Rebuild benchmark/runs.js from the run folders, without calling any model"
run = "benchmark/bench.py index"

