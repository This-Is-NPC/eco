name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  package-linux:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd # base-devel, 2026-10-09
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build toolchain
        run: pacman -Syu --noconfirm --needed cmake git github-cli ninja qt6-base qt6-declarative rust usage

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && scripts/package"

      - name: Attach the package to the release
        run: |
          gh release upload "$TAG" target/arch/pkg/eco-[0-9]*.pkg.tar.zst --clobber

  package-windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # scripts/window-build uses CMake's "Visual Studio 17 2022" generator;
    # windows-latest carries Visual Studio 2026 instead.
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only the tools the package needs; the rest of mise.toml is not installed.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install the pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust python cmake uv pipx:miurahr/aqtinstall dotnet dotnet:wix
          cache: false

      # window:build, which package runs first, installs Qt through qt:install.
      - name: Build the package
        run: mise run package

      - name: Attach the package to the release
        run: gh release upload $env:TAG (Get-Item dist\eco-*-windows-x86_64.msi).FullName --clobber

  package-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Apple Silicon: the archive is aarch64 alone.
    runs-on: macos-14
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only the tools the package needs; the rest of mise.toml is not installed.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install the pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: rust python cmake ninja uv pipx:miurahr/aqtinstall
          cache: false

      # window:build installs Qt through qt:install and builds eco.app, which
      # package bundles.
      - name: Build the package
        run: |
          mise run window:build
          mise run package

      - name: Attach the package to the release
        run: gh release upload "$TAG" dist/eco-*-macos-aarch64.tar.gz --clobber

  # One SHA256SUMS for every package, in the format install.sh checks. It
  # still runs when only the Windows or the macOS package failed: install.sh
  # needs it.
  checksums:
    needs: [release-please, package-linux, package-windows, package-macos]
    if: ${{ !cancelled() && needs.package-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Attach SHA256SUMS to the release
        run: |
          gh release download "$TAG" --pattern 'eco-*' --dir assets
          cd assets
          sha256sum eco-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
