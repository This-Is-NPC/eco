[package]
name = "eco"
version = "0.6.0"
edition = "2024"
description = "Real-time meeting assistant for Omarchy"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
clap_usage = "5.0.0"
futures = "0.3.34"
hound = "3.5.1"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "multipart"] }
rustfft = "6.4.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.0"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
toml = "1.1.6"
tract-onnx = "0.23.8"
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
# The keyring crates' Windows Credential Manager store, with its search to list eco's keys.
keyring-core = "1.0.0"
rpassword = "7.5.4"
windows-native-keyring-store = { version = "1.1.0", default-features = false, features = ["search"] }
windows-hotkeys = { version = "0.2.1", default-features = false }
# Toast notifications, through the safe WinRT projection.
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications"] }
# The registry key that names eco's toasts, through a safe interface.
windows-registry = "0.6.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

# Dependencies (tract, rustfft) optimised in debug builds: the model parity tests
# run in a fraction of the time.
[profile.dev.package."*"]
opt-level = 3
