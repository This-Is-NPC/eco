[package]
name = "eco"
version = "0.1.1"
edition = "2024"
description = "Real-time meeting assistant for Omarchy"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3.34"
hound = "3.5.1"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "multipart"] }
rustfft = "6.4.1"
rustix = { version = "1.1.5", features = ["process"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net", "sync", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
toml = "1.1.6"
tract-onnx = "0.23.8"
unicode-normalization = "0.1.25"
uuid = { version = "1.27.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

# Dependencies (tract, rustfft) optimised in debug builds: the model parity tests
# run in a fraction of the time.
[profile.dev.package."*"]
opt-level = 3
